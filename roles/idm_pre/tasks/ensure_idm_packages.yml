---

# on RHEL 8 or lower fail
# on RHEL 9++ just dnf install
- name: "Check OS minimum version"
  ansible.builtin.assert:
    that: (ansible_distribution_major_version | int) > 8
    fail_msg: "Deployment on RHEL 8 or lower is no longer supported"
  tags:
    - tags_rhis_builder
    - tags_rhis_builder_idm
    - tags_idm_pre
    - tags_idm_install

- name: "Install the components"
  when: (ansible_distribution_major_version | int) > 8
  block:

    - name: "Install IdM packages"
      ansible.builtin.dnf:
        name:
          - ipa-server
          - ipa-server-dns
          - ipa-server-trust-ad
          - ipa-healthcheck
      tags:
        - tags_rhis_builder
        - tags_rhis_builder_idm
        - tags_idm_pre
        - tags_idm_install

- name: "Install the SOS Report package"
  ansible.builtin.dnf:
    name: sos
    state: present
  tags:
    - tags_rhis_builder
    - tags_rhis_builder_idm
    - tags_idm_pre
    - tags_idm_install
